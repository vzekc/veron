name: image

on:
  # Gate image builds on CI: this workflow only runs after the CI
  # workflow on the same commit finishes successfully. workflow_dispatch
  # is kept as a manual escape hatch (e.g. rebuild without re-running CI
  # when only the Dockerfile changed).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/vzekc/veron

jobs:
  build-push:
    # workflow_run fires on any completion (success + failure). Build
    # only when CI passed; workflow_dispatch bypasses the gate.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact commit CI tested, not whatever main points
          # at right now (another push may have landed in between).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          submodules: recursive
          # Unshallow clone: the image retains .git so deploy/deploy.sh
          # can `git fetch origin main && git reset --hard` inside the
          # running pod. A shallow history breaks that.
          fetch-depth: 0
          # Don't leave the ephemeral CI token in .git/config — it
          # expires when the workflow ends, and the running pod would
          # then fail on `git fetch` because the cached creds are stale.
          # veron is a public repo; anonymous fetch is fine.
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Short hash of the checked-out commit (the one CI tested) for the
      # immutable image tag below.
      - id: commit
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # Immutable, time-ordered tag that Flux image automation in
            # vzekc/cluster picks up and pins in the deployment.
            type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}-${{ steps.commit.outputs.short }},enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
