name: image

on:
  # Gate image builds on CI: this workflow only runs after the CI
  # workflow on the same commit finishes successfully. workflow_dispatch
  # is kept as a manual escape hatch (e.g. rebuild without re-running CI
  # when only the Dockerfile changed).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/vzekc/veron

jobs:
  build-push:
    # workflow_run fires on any completion (success + failure). Build
    # only when CI passed; workflow_dispatch bypasses the gate.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact commit CI tested, not whatever main points
          # at right now (another push may have landed in between).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          submodules: recursive
          # Unshallow clone: the image retains .git so deploy/deploy.sh
          # can `git fetch origin main && git reset --hard` inside the
          # running pod. A shallow history breaks that.
          fetch-depth: 0
          # Don't leave the ephemeral CI token in .git/config — it
          # expires when the workflow ends, and the running pod would
          # then fail on `git fetch` because the cached creds are stale.
          # veron is a public repo; anonymous fetch is fine.
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    # Only auto-deploy on main. workflow_dispatch runs won't trigger unless
    # explicitly intended: if someone re-runs a dispatch on main, that's
    # still a main-branch build and a deploy is fine.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      # Serialize deploys; the script is safe to re-run but racing two
      # soft-deploys against the same pod just wastes time.
      group: deploy-veron-prod
      cancel-in-progress: false
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2

      - name: Write kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_VERON_DEPLOY }}
        run: |
          printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Soft-deploy (hot-reload via Swank) with image fallback
        env:
          NAMESPACE: dev
          DEPLOYMENT: veron
        run: |
          set -euo pipefail

          pod=$(kubectl -n "$NAMESPACE" get pod -l app="$DEPLOYMENT" \
                        --field-selector=status.phase=Running \
                        -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

          if [[ -z "$pod" ]]; then
            echo "::notice::no running veron pod — doing a cold rollout"
            kubectl -n "$NAMESPACE" rollout restart "deployment/$DEPLOYMENT"
            kubectl -n "$NAMESPACE" rollout status  "deployment/$DEPLOYMENT" --timeout=3m
            exit 0
          fi

          echo "::notice::target pod $pod — attempting hot-reload"
          if kubectl -n "$NAMESPACE" exec "$pod" -- \
                bash -c 'cd /opt/veron && ./deploy/deploy.sh'; then
            echo "::notice::hot-reload succeeded"
          else
            echo "::warning::hot-reload failed — rolling out a fresh pod from :main"
            kubectl -n "$NAMESPACE" rollout restart "deployment/$DEPLOYMENT"
            kubectl -n "$NAMESPACE" rollout status  "deployment/$DEPLOYMENT" --timeout=3m
          fi
